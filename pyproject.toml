[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelvitals"
version = "0.4.0"
description = "AI reliability & observability toolkit - monitor, evaluate, explain, and protect ML models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Sowaiba Arshad" }]
keywords = ["machine-learning", "mlops", "monitoring", "drift", "evaluation", "observability", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/Sowaiba-01/modelsentinel"
Repository = "https://github.com/Sowaiba-01/modelsentinel"
Issues = "https://github.com/Sowaiba-01/modelsentinel/issues"

[tool.hatch.build.targets.wheel]
packages = ["modelsentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
